name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        working-directory: kernel
        run: rustup show

      - name: Add bare-metal target
        working-directory: kernel
        run: rustup target add x86_64-unknown-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build kernel
        working-directory: kernel
        run: |
          RUSTFLAGS="-C relocation-model=static -C target-feature=+sse,+sse2,-soft-float" \
            cargo build --target x86_64-unknown-none --profile dev
